<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalle del Producto | Maye Mundo Belleza</title>
    <meta name="description" content="Descubre los beneficios, modo de uso e ingredientes de tus productos favoritos de Maye Mundo Belleza.">
    <link rel="icon" href="https://res.cloudinary.com/ocnnxclz/image/upload/v1784219028/333_mvofgw.png" type="image/png">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/remixicon@4.5.0/fonts/remixicon.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://res.cloudinary.com" crossorigin>
    <link rel="dns-prefetch" href="https://res.cloudinary.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <script type="module" src="/js/entries/entry-producto.js"></script>
</head>
<body>

    {{> barra-anuncio }}
    {{> header }}

    <!-- BREADCRUMB -->
    <nav class="breadcrumb" aria-label="Migas de pan" id="breadcrumb-producto">
        <div class="contenedor">
            <ol class="breadcrumb__lista">
                <li class="breadcrumb__item">
                    <a href="/index.html"><i class="ri-home-4-line"></i> Inicio</a>
                </li>
                <li class="breadcrumb__separador" aria-hidden="true"><i class="ri-arrow-right-s-line"></i></li>
                <li class="breadcrumb__item">
                    <a href="/paginas/productos.html">Catálogo</a>
                </li>
                <li class="breadcrumb__separador" aria-hidden="true"><i class="ri-arrow-right-s-line"></i></li>
                <li class="breadcrumb__item breadcrumb__item--actual" aria-current="page" id="breadcrumb-nombre">Cargando...</li>
            </ol>
        </div>
    </nav>

    <!-- CONTENIDO PRINCIPAL (renderizado por JS) -->
    <main class="producto-principal" id="producto-principal" aria-live="polite">
        <div class="contenedor">
            <div class="producto-loading">
                <div class="skeleton producto-loading__imagen" style="height:500px"></div>
                <div class="producto-loading__info">
                    <div class="skeleton skeleton--categoria" style="height:24px;width:130px;margin-bottom:14px"></div>
                    <div class="skeleton" style="height:38px;width:90%;margin-bottom:18px"></div>
                    <div class="skeleton" style="height:20px;width:100%;margin-bottom:8px"></div>
                    <div class="skeleton" style="height:20px;width:95%;margin-bottom:8px"></div>
                    <div class="skeleton" style="height:20px;width:80%;margin-bottom:30px"></div>
                    <div class="skeleton" style="height:52px;width:100%"></div>
                </div>
            </div>
        </div>
    </main>

    <!-- PRODUCTOS RELACIONADOS (renderizado por JS) -->
    <section class="seccion-productos relacionados" id="relacionados" hidden>
        <div class="contenedor">
            <h2 class="titulo-seccion">Productos relacionados</h2>
            <p class="subtitulo-seccion">También te puede interesar de la misma categoría</p>
            <div class="grilla-productos" id="grilla-relacionados">
                <!-- llenado por JS -->
            </div>
            <div style="text-align:center;margin-top:36px">
                <a href="/paginas/productos.html" class="btn btn-secundario btn-secundario--verde">
                    <i class="ri-store-2-line"></i> Ver todo el catálogo
                </a>
            </div>
        </div>
    </section>

    {{> footer }}
    {{> whatsapp-flotante }}

</body>
</html>
